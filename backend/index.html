
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESPESCORE - Football Live</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#151515;color:white;font-family:Arial,sans-serif}
header{background:#d71920;padding:20px;text-align:center;border-bottom:4px solid #ffd43b}
header h1{margin:0;font-size:28px}
header p{margin:7px 0 0;color:#ffe5a0}
nav{display:flex;gap:10px;padding:15px;justify-content:center;flex-wrap:wrap}
button{background:#252525;color:white;border:1px solid #ffd43b;padding:11px 20px;border-radius:8px;font-weight:bold}
button.active{background:#ffd43b;color:#151515}
#date{background:#252525;color:white;padding:10px;border:1px solid #ffd43b;border-radius:8px}
main{max-width:850px;margin:auto;padding:12px}
h2{color:#ffd43b}
.league{background:#252525;margin:15px 0;border-radius:10px;overflow:hidden}
.league-title{padding:12px;background:#333;font-weight:bold;color:#ffd43b}
.match{display:flex;align-items:center;justify-content:space-between;padding:14px 10px;border-bottom:1px solid #444;gap:8px;cursor:pointer}
.match:last-child{border:0}
.team{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.team.away{justify-content:flex-end;text-align:right}
.team img{width:27px;height:27px;object-fit:contain}
.team span{font-size:13px;overflow-wrap:anywhere}
.score{text-align:center;min-width:75px;font-weight:bold;color:#ffd43b}
.status{font-size:11px;color:#aaa;margin-top:5px}
.live{color:#ff4545}
#details{display:none;background:#252525;padding:18px;border-radius:12px;margin-top:15px}
#details h2{text-align:center}
.scoreboard{display:flex;justify-content:space-around;align-items:center;text-align:center;gap:10px;margin:25px 0}
.scoreboard img{width:55px;height:55px;object-fit:contain}
.scoreboard strong{font-size:25px;color:#ffd43b}
.event{padding:12px;border-bottom:1px solid #444}
.muted{text-align:center;color:#aaa;padding:25px}
.back{background:#d71920;border:0;margin-bottom:15px}
</style>
</head>
<body>
<header>
<h1>ESPESCORE ⚽</h1>
<p>● FOOTBALL LIVE</p>
</header>

<nav id="nav">
<button id="todayBtn" class="active" onclick="showToday()">Today</button>
<button id="liveBtn" onclick="showLive()">🔴 Live</button>
<input id="date" type="date">
</nav>

<main>
<section id="matches">
<h2 id="pageTitle">Today's Matches</h2>
<div id="matchList" class="muted">Loading matches...</div>
</section>

<section id="details">
<button class="back" onclick="backToMatches()">← Back to matches</button>
<div id="detailContent"></div>
</section>
</main>

<script>
const API = "";
const matchList = document.getElementById("matchList");
const details = document.getElementById("details");
const matchesSection = document.getElementById("matches");
const dateInput = document.getElementById("date");

let currentMode = "today";
let refreshTimer = null;

function todayDate(){
const d = new Date();
return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}

dateInput.value = todayDate();

function safe(value){
return String(value ?? "").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

function statusText(match){
const s=match.fixture?.status || {};
return s.short || s.long || "NS";
}

async function loadMatches(){
if(currentMode==="details") return;

matchList.innerHTML='<div class="muted">Loading matches...</div>';

try{
let url=currentMode==="live"
? "/live"
: "/fixtures?date="+encodeURIComponent(dateInput.value);

const response=await fetch(API+url);
if(!response.ok) throw new Error("Server error");

const data=await response.json();
renderMatches(data.response || []);
}catch(error){
matchList.innerHTML='<div class="muted">Unable to load matches. Please try again.</div>';
}
}

function renderMatches(matches){
if(!matches.length){
matchList.innerHTML='<div class="muted">No matches found.</div>';
return;
}

const groups={};

matches.forEach((m,i)=>{
const league=m.league?.name || "Other matches";
const country=m.league?.country || "";
if(!groups[league]) groups[league]={country,matches:[]};
groups[league].matches.push({...m,_index:i});
});

matchList.innerHTML=Object.entries(groups).map(([league,g])=>`
<div class="league">
<div class="league-title">🏆 ${safe(league)} · ${safe(g.country)}</div>
${g.matches.map(m=>{
const home=m.teams?.home || {};
const away=m.teams?.away || {};
const status=statusText(m);
const scoreHome=m.goals?.home;
const scoreAway=m.goals?.away;
return `
<div class="match" onclick="openDetails(${Number(m.fixture?.id)})">
<div class="team">
${home.logo?`<img src="${safe(home.logo)}" alt="">`:""}
<span>${safe(home.name || "Home")}</span>
</div>
<div class="score">
${scoreHome??"-"} : ${scoreAway??"-"}
<div class="status ${status==="LIVE"?"live":""}">${safe(status)}</div>
</div>
<div class="team away">
<span>${safe(away.name || "Away")}</span>
${away.logo?`<img src="${safe(away.logo)}" alt="">`:""}
</div>
</div>`;
}).join("")}
</div>`).join("");
}

async function openDetails(id){
if(!Number.isSafeInteger(id)||id<=0) return;

currentMode="details";
clearInterval(refreshTimer);
matchesSection.style.display="none";
document.getElementById("nav").style.display="none";
details.style.display="block";
document.getElementById("detailContent").innerHTML='<div class="muted">Loading match details...</div>';

try{
const response=await fetch("/fixture/"+id);
if(!response.ok) throw new Error("Details unavailable");

const data=await response.json();
const m=data.response?.[0];

if(!m) throw new Error("Match not found");

const home=m.teams?.home || {};
const away=m.teams?.away || {};

const events=m.events || [];

document.getElementById("detailContent").innerHTML=`
<h2>${safe(m.league?.name || "Match Details")}</h2>
<div class="scoreboard">
<div>${home.logo?`<img src="${safe(home.logo)}">`:""}<p>${safe(home.name)}</p></div>
<strong>${m.goals?.home??"-"} - ${m.goals?.away??"-"}</strong>
<div>${away.logo?`<img src="${safe(away.logo)}">`:""}<p>${safe(away.name)}</p></div>
</div>
<p class="muted">${safe(statusText(m))}</p>
<h2>Match Events</h2>
${events.length?events.map(e=>`
<div class="event">
${safe(e.minute)}' · ${safe(e.type)} · ${safe(e.player)}
<br><small>${safe(e.team)} ${safe(e.detail)}</small>
</div>`).join(""):'<div class="muted">No events available.</div>'}
`;
}catch(error){
document.getElementById("detailContent").innerHTML=
'<div class="muted">Unable to load match details.</div>';
}
}

function backToMatches(){
details.style.display="none";
matchesSection.style.display="block";
document.getElementById("nav").style.display="flex";
currentMode="today";
showToday();
}

function setActive(id){
document.getElementById("todayBtn").classList.remove("active");
document.getElementById("liveBtn").classList.remove("active");
document.getElementById(id).classList.add("active");
}

function showToday(){
currentMode="today";
setActive("todayBtn");
document.getElementById("pageTitle").textContent="Today's Matches";
loadMatches();
}

function showLive(){
currentMode="live";
setActive("liveBtn");
document.getElementById("pageTitle").textContent="Live Matches";
loadMatches();
}

dateInput.addEventListener("change",()=>{
if(currentMode!=="live") showToday();
});

showToday();
refreshTimer=setInterval(()=>{
if(currentMode!=="details") loadMatches();
},60000);
</script>
</body>
</html>
